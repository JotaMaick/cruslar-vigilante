name: Vigilar Cruslar

# Cada 5 minutos. GitHub avisa de que los cron pueden retrasarse en horas punta:
# para detectar una caída eso da igual, y a cambio no cuesta nada en repos
# públicos. El vigilante no necesita ser puntual, necesita EXISTIR cuando el
# servidor no esté.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:        # para poder lanzarlo a mano y comprobar que funciona

permissions:
  contents: write           # solo para guardar estado.json entre pasadas

concurrency:
  group: vigilar            # si una pasada se retrasa, que no se pisen dos
  cancel-in-progress: false

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar sitios y latido
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # La URL del latido va en un secreto A PROPÓSITO: el repositorio es
          # público, y si la ruta fuese visible cualquiera podría consultar si el
          # vigía está caído justo antes de atacar.
          URL_LATIDO: ${{ secrets.URL_LATIDO }}
        run: python3 vigilar.py

      # El push PUEDE fallar si alguien tocó el repo mientras corría la
      # comprobación (pasó el 12-ago). Y si falla, el estado no se guarda y la
      # siguiente pasada repite el aviso que ya mandó. Por eso reintenta
      # reintegrando lo de fuera: guardar el estado importa tanto como comprobar.
      - name: Guardar el estado si ha cambiado
        run: |
          if [ -z "$(git status --porcelain estado.json)" ]; then
            echo "sin cambios que guardar"; exit 0
          fi
          git config user.name  "Vigilante Cruslar"
          git config user.email "info@cruslar.com"
          git add estado.json
          git commit -m "vigilante: $(date -u '+%Y-%m-%d %H:%M UTC')"
          for intento in 1 2 3; do
            if git push; then echo "guardado en el intento $intento"; exit 0; fi
            echo "rechazado; reintegro lo de fuera y reintento"
            git pull --rebase --autostash origin main || exit 1
            sleep 3
          done
          echo "::error::no pude guardar el estado tras 3 intentos"
          exit 1
